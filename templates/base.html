<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Meu Blog</title>
  </head>
  <body>
    <header>
      <h1>Meu Blog Django</h1>

      <nav>
        <a href="{% url 'blog:post_list' %}"> Página inicial </a>

        <a href="{% url 'blog:post_create' %}"> Nova postagem </a>

        <a href="{% url 'blog:category_list' %}"> Categorias </a>

        {% if user.is_authenticated %}

        <span>Usuário: {{ user.username }}</span>

        <form method="post" action="{% url 'blog:logout' %}">
          {% csrf_token %}
          <button type="submit">Sair</button>
        </form>

        {% else %}

        <a href="{% url 'blog:login' %}">Entrar</a>

        {% endif %}
      </nav>
    </header>

    <main>{% block content %} {% endblock %}</main>
  </body>
</html>
