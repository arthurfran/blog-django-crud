{% extends 'base.html' %} {% block content %}

<h2>Postagens</h2>

{% for post in posts %}

<h3>
  <a href="{% url 'blog:post_detail' post.pk %}"> {{ post.title }} </a>
</h3>

<p>Publicado em: {{ post.created_at|date:"d/m/Y H:i" }}</p>

{% empty %}
<p>Nenhuma postagem cadastrada.</p>
{% endfor %} {% endblock %}
